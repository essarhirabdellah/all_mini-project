<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Liste de tâches</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app">
      <h1>My tasks</h1>
      <form id="todo-form" class="add">
        <input
          id="todo-input"
          name="title"
          placeholder="What needs to be done?"
          autocomplete="off"
        />
        <button type="submit">Add</button>
      </form>
      <p id="todo-error" class="error" hidden>Please type a task first.</p>
      <nav class="filters" aria-label="Filter tasks">
        <button type="button" data-filter="all" class="active">All</button>
        <button type="button" data-filter="active">Active</button>
        <button type="button" data-filter="done">Done</button>
      </nav>
      <ul id="todo-list" class="list">
      </ul>
      <p id="todo-count" class="count"></p>
    </main>
    <script src="mini.js"></script>
  </body>
</html>
